<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NeonHub</title><link rel="stylesheet" href="style.css"></head><body><canvas id="particles"></canvas><div class="shell"><header><div class="heading"><div class="logo">✦</div><div><h1>NeonHub</h1><p id="summary"></p></div></div><button id="addCategory" class="primary">＋ 添加模块</button></header><div id="toast" role="status"></div><div id="account"><span id="userEmail"></span><button id="logoutBtn">退出</button></div><main id="layout"></main></div><div id="loginView"><div class="login-card"><div class="logo">✦</div><h2>登录 NeonHub</h2><p>登录后管理你的常用网页</p><form id="loginForm"><input id="loginEmail" type="email" placeholder="邮箱" required><input id="loginPassword" type="password" placeholder="密码" required><button class="primary" type="submit">登录</button><div id="loginError"></div></form></div></div><dialog id="modal"><form method="dialog" id="form"><h2 id="modalTitle">添加网页</h2><input id="title" required><input id="url" required><div class="dialog-actions"><button type="button" id="cancelBtn">取消</button><button class="primary" value="default">保存</button></div></form></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
